<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>O Reino Silábico Encantado - Jogo Educativo de Sílabas</title>
  <meta name="description" content="Jogo educativo encantador para crianças aprenderem divisão silábica em português com áudio interativo, desafios e recompensas mágicas.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Quicksand:wght@500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <style>
    :root {
      --pink-primary: #ec4899;
      --pink-dark: #be185d;
      --purple-primary: #a855f7;
      --amber-gold: #f59e0b;
      --emerald-green: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      font-family: 'Quicksand', sans-serif;
      background: linear-gradient(135deg, #fce7f3 0%, #f3e8ff 50%, #e0f2fe 100%);
      min-height: 100vh;
      width: 100vw;
      overflow-x: hidden;
      color: #334155;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .ambient-decor {
      position: fixed;
      pointer-events: none;
      z-index: 0;
      opacity: 0.22;
      animation: floatSlow 6s ease-in-out infinite;
    }
    @keyframes floatSlow {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-12px) rotate(3deg); }
    }

    .app-container {
      position: relative;
      z-index: 10;
      max-width: 1200px;
      margin: 0 auto;
      padding: 8px 12px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-height: 100vh;
      justify-content: space-between;
    }

    .header-bar {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(244, 114, 182, 0.4);
      border-radius: 20px;
      padding: 6px 14px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      box-shadow: 0 4px 12px rgba(244, 114, 182, 0.1);
    }

    .brand-title {
      font-family: 'Fredoka', cursive;
      font-weight: 700;
      font-size: 1.15rem;
      color: #db2777;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .badge-star {
      background: linear-gradient(135deg, #fef3c7, #fce7f3);
      border: 1px solid #fcd34d;
      padding: 4px 10px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      gap: 4px;
      font-family: 'Fredoka', cursive;
      font-weight: 700;
      font-size: 0.95rem;
      color: #b45309;
    }

    .btn-action {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      padding: 5px 10px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 0.75rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      color: #475569;
      transition: all 0.15s ease;
    }
    .btn-action:hover {
      background: #fdf2f8;
      color: #db2777;
      border-color: #fbcfe8;
    }
    .btn-action.primary {
      background: linear-gradient(135deg, #a855f7, #ec4899);
      color: #ffffff;
      border: none;
      box-shadow: 0 2px 8px rgba(236, 72, 153, 0.3);
    }

    .level-selector-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
    }
    @media (min-width: 640px) {
      .level-selector-grid {
        grid-template-columns: repeat(4, 1fr);
      }
    }

    .level-card-btn {
      padding: 8px 10px;
      border-radius: 16px;
      border: 2px solid #e2e8f0;
      background: #ffffff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: all 0.15s ease;
      text-align: left;
    }
    .level-card-btn.active.lvl-1 { background: linear-gradient(135deg, #10b981, #14b8a6); color: white; border-color: #059669; }
    .level-card-btn.active.lvl-2 { background: linear-gradient(135deg, #a855f7, #ec4899); color: white; border-color: #9333ea; }
    .level-card-btn.active.lvl-3 { background: linear-gradient(135deg, #f59e0b, #ea580c); color: white; border-color: #d97706; }
    .level-card-btn.active.lvl-4 { background: linear-gradient(135deg, #e11d48, #db2777); color: white; border-color: #be123c; }

    .level-title-text {
      font-family: 'Fredoka', cursive;
      font-weight: 700;
      font-size: 0.85rem;
    }
    .level-badge-count {
      font-size: 0.7rem;
      font-weight: 800;
      padding: 2px 6px;
      border-radius: 10px;
      background: rgba(0, 0, 0, 0.1);
    }

    .game-main-card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border: 3px solid #fbcfe8;
      border-radius: 28px;
      padding: 12px 16px;
      box-shadow: 0 12px 30px rgba(244, 114, 182, 0.2);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .card-top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      padding-bottom: 8px;
      border-bottom: 1px solid #fce7f3;
      flex-wrap: wrap;
    }

    .nav-arrow-btn {
      background: #fdf2f8;
      border: 1px solid #fbcfe8;
      color: #db2777;
      width: 34px;
      height: 34px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      cursor: pointer;
      font-weight: bold;
    }

    .stage-layout {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
      align-items: center;
    }
    @media (min-width: 768px) {
      .stage-layout {
        grid-template-columns: 5fr 7fr;
        gap: 20px;
      }
    }

    .left-panel {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, rgba(253, 242, 248, 0.7) 0%, rgba(245, 243, 255, 0.5) 100%);
      padding: 12px;
      border-radius: 22px;
      border: 1px solid #fbcfe8;
    }

    .unit-toggle-pills {
      display: flex;
      background: #ffffff;
      padding: 3px;
      border-radius: 14px;
      border: 1px solid #e2e8f0;
      gap: 3px;
      margin-bottom: 8px;
    }
    .unit-pill-btn {
      padding: 4px 12px;
      border-radius: 10px;
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
      border: none;
      background: transparent;
      color: #64748b;
    }
    .unit-pill-btn.active {
      background: #ec4899;
      color: white;
    }

    .illustration-frame {
      width: 170px;
      height: 170px;
      border-radius: 24px;
      background: linear-gradient(135deg, #fbcfe8, #ddd6fe, #fef08a);
      padding: 5px;
      box-shadow: 0 8px 20px rgba(244, 114, 182, 0.3);
      cursor: pointer;
      position: relative;
    }
    .illustration-inner {
      width: 100%;
      height: 100%;
      background: #ffffff;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    .hidden-name-pill {
      margin-top: 8px;
      background: rgba(255, 255, 255, 0.9);
      border: 1.5px dashed #f472b6;
      border-radius: 14px;
      padding: 5px 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }
    .hidden-name-pill.revealed {
      border: 2px solid #10b981;
      background: #ffffff;
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.2);
    }

    .btn-audio-speak {
      margin-top: 8px;
      width: 100%;
      max-width: 240px;
      background: linear-gradient(135deg, #9333ea, #ec4899, #f43f5e);
      color: white;
      border: none;
      padding: 9px 16px;
      border-radius: 16px;
      font-family: 'Fredoka', cursive;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-shadow: 0 4px 14px rgba(236, 72, 153, 0.35);
    }

    .support-tools-row {
      margin-top: 8px;
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .support-tool-btn {
      background: #ffffff;
      border: 1px solid #fbcfe8;
      color: #be185d;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .hint-bubble {
      margin-top: 6px;
      background: rgba(255, 255, 255, 0.8);
      border: 1px solid #fce7f3;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 0.75rem;
      color: #64748b;
      text-align: center;
    }

    .right-panel {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .assembly-box-card {
      background: linear-gradient(135deg, rgba(253, 244, 255, 0.7), rgba(254, 242, 242, 0.7));
      border: 2px solid #f5d0fe;
      border-radius: 22px;
      padding: 12px 14px;
      text-align: center;
    }
    .slots-container {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 64px;
      margin-top: 6px;
    }

    .slot-tile {
      min-width: 52px;
      height: 60px;
      padding: 0 8px;
      border-radius: 18px;
      font-family: 'Fredoka', cursive;
      font-weight: 700;
      font-size: 1.6rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: relative;
    }
    .slot-tile.empty {
      background: rgba(255, 255, 255, 0.9);
      border: 2.5px dashed #f472b6;
      color: rgba(244, 114, 182, 0.4);
    }
    .slot-tile.filled {
      background: linear-gradient(135deg, #ec4899, #9333ea);
      color: white;
      box-shadow: 0 4px 12px rgba(236, 72, 153, 0.3);
      border: 2px solid #fbcfe8;
    }

    .options-box-card {
      background: rgba(255, 255, 255, 0.9);
      border: 2px solid #ede9fe;
      border-radius: 22px;
      padding: 12px 14px;
      text-align: center;
    }
    .options-container {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 8px;
    }

    .cloud-btn {
      font-family: 'Fredoka', cursive;
      font-weight: 700;
      font-size: 1.3rem;
      padding: 10px 18px;
      border-radius: 20px;
      border: 2.5px solid #fbcfe8;
      background: #ffffff;
      color: #be185d;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(244, 114, 182, 0.15);
      transition: all 0.15s ease;
    }
    .cloud-btn:hover {
      background: #fdf2f8;
      transform: scale(1.06);
    }
    .cloud-btn.used {
      opacity: 0.2;
      transform: scale(0.9);
      cursor: not-allowed;
    }

    .feedback-banner {
      min-height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 16px;
      font-weight: 700;
      font-size: 0.85rem;
      padding: 6px 14px;
      text-align: center;
    }
    .feedback-banner.success {
      background: #ecfdf5;
      color: #065f46;
      border: 1.5px solid #6ee7b7;
    }
    .feedback-banner.error {
      background: #fff1f2;
      color: #9f1239;
      border: 1.5px solid #fecdd3;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(4px);
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 12px;
    }
    .modal-overlay.open { display: flex; }
    .modal-card {
      background: #ffffff;
      border-radius: 28px;
      max-width: 900px;
      width: 100%;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      border: 3px solid #fbcfe8;
      overflow: hidden;
    }
    .modal-header {
      background: linear-gradient(135deg, #ec4899, #9333ea);
      color: white;
      padding: 12px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .modal-close-btn {
      background: rgba(255, 255, 255, 0.2);
      border: none;
      color: white;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
    }
    .word-grid-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 8px;
    }
    .repo-item-card {
      background: white;
      border: 1.5px solid #fce7f3;
      border-radius: 16px;
      padding: 8px 10px;
      cursor: pointer;
    }
    .repo-item-card:hover {
      border-color: #ec4899;
    }
    .app-footer {
      text-align: center;
      font-size: 0.75rem;
      color: #64748b;
      padding: 6px;
    }
  </style>
</head>
<body>

  <div class="ambient-decor" style="top: 20px; left: 20px; font-size: 2.2rem;">☁️</div>
  <div class="ambient-decor" style="top: 35px; right: 30px; font-size: 2rem;">✨</div>
  <div class="ambient-decor" style="bottom: 30px; left: 30px; font-size: 2.2rem;">🧚‍♀️</div>
  <div class="ambient-decor" style="bottom: 35px; right: 25px; font-size: 2.2rem;">🦄</div>

  <div class="app-container">

    <header class="header-bar">
      <div class="brand-title">
        <span>👑</span>
        <span>Reino Silábico Encantado</span>
      </div>

      <div class="header-actions">
        <button class="btn-action primary" onclick="openRepoModal()">
          <span>📚</span>
          <span>Repositório (50)</span>
        </button>

        <button class="btn-action" onclick="speakPrincessAffirmation()">
          <span>👑</span>
          <span>Voz da Princesa</span>
        </button>

        <button class="btn-action" id="soundToggleBtn" onclick="toggleSound()">
          <span>🔊</span>
          <span id="soundLabel">Som</span>
        </button>

        <div class="badge-star" title="Suas estrelas conquistadas">
          <span>⭐</span>
          <span id="starsDisplay">0</span>
        </div>
      </div>
    </header>

    <div class="level-selector-grid">
      <button class="level-card-btn lvl-1 active" id="btnLvl1" onclick="selectLevel(1)">
        <div>
          <span class="level-title-text">🌸 Nível 1: Simples</span>
          <div style="font-size: 0.65rem; opacity: 0.85;">FA-DA, CO-RO-A, LUA...</div>
        </div>
        <span class="level-badge-count">50</span>
      </button>
    </div>

    <main class="game-main-card">
      <div class="card-top-bar">
        <button class="nav-arrow-btn" onclick="prevWord()" title="Palavra anterior">◀</button>

        <div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap;">
          <span id="currentLevelBadge" style="background:#fdf2f8; color:#be185d; border:1px solid #fbcfe8; padding:3px 10px; border-radius:12px; font-weight:bold; font-size:0.75rem;">
            🌸 Nível 1: Simples
          </span>
          <span id="wordProgressCounter" style="font-size:0.8rem; font-weight:bold; color:#64748b;">
            Palavra 1 de 50
          </span>
        </div>

        <button class="nav-arrow-btn" onclick="nextWord()" title="Próxima palavra">▶</button>
      </div>

      <div class="stage-layout">

        <div class="left-panel">
          <div class="unit-toggle-pills">
            <button class="unit-pill-btn active" id="btnModeLetters" onclick="setAssemblyMode('letters')">
              🔤 Por Letras
            </button>
            <button class="unit-pill-btn" id="btnModeSyllables" onclick="setAssemblyMode('syllables')">
              🧩 Por Sílabas
            </button>
          </div>

          <div class="illustration-frame" onclick="speakCurrentWord()" title="Toque para ouvir!">
            <div class="illustration-inner">
              <div id="illustrationSvgContainer" style="font-size: 5rem;">🧚‍♀️</div>
            </div>
          </div>

          <div class="hidden-name-pill" id="objectNamePill" onclick="handlePeekName()" title="Nome do objeto oculto! Toque para espiar">
            <span id="hiddenPillIcon" style="font-size:0.85rem;">🙈</span>
            <span id="hiddenPillTitle" style="font-weight:700; font-size:0.85rem; color:#64748b;">Nome Oculto:</span>
            <span id="hiddenPillContent" style="font-weight:800; font-size:0.85rem; color:#db2777; letter-spacing:1px;">❓ · ❓</span>
          </div>

          <button class="btn-audio-speak" onclick="speakCurrentWord()">
            <span>🔊</span>
            <span>Ouvir Palavra</span>
          </button>

          <div class="support-tools-row">
            <button class="support-tool-btn" onclick="spellWord()">
              <span>🔤</span>
              <span>Soletrar</span>
            </button>
            <button class="support-tool-btn" onclick="clapWord()">
              <span>👏</span>
              <span>Palmas</span>
            </button>
            <button class="support-tool-btn" onclick="handlePeekName()">
              <span>👁️</span>
              <span>Espiar (2s)</span>
            </button>
          </div>

          <div class="hint-bubble" id="wordHintText">
            💡 Dica mágica...
          </div>
        </div>

        <div class="right-panel">
          <div class="assembly-box-card">
            <div style="font-size: 0.8rem; font-weight: 800; color: #7e22ce; text-transform: uppercase;">
              ✨ Campo de Montagem da Palavra:
            </div>
            <div class="slots-container" id="slotsContainer"></div>
          </div>

          <div class="options-box-card">
            <div style="font-size: 0.8rem; font-weight: 800; color: #be185d; text-transform: uppercase;">
              ☁️ Toque para Escolher:
            </div>
            <div class="options-container" id="optionsContainer"></div>
          </div>

          <div class="feedback-banner" id="feedbackBanner" style="display: none;"></div>

          <div style="display: flex; gap: 8px; justify-content: flex-end;">
            <button class="btn-action" onclick="resetCurrentWord()">
              <span>🔄</span>
              <span>Limpar</span>
            </button>
            <button class="btn-action primary" onclick="nextWord()">
              <span>Próxima</span>
              <span>▶</span>
            </button>
          </div>
        </div>

      </div>
    </main>

    <footer class="app-footer">
      O Reino Silábico Encantado · Alfabetização Lúdica & Consciência Silábica
    </footer>

  </div>

  <div class="modal-overlay" id="repoModalOverlay" onclick="closeRepoModalOnBackdrop(event)">
    <div class="modal-card">
      <div class="modal-header">
        <div style="display: flex; align-items: center; gap: 8px;">
          <span style="font-size: 1.4rem;">📚</span>
          <div>
            <div style="font-family: 'Fredoka', cursive; font-weight: 700; font-size: 1.15rem;">
              Repositório de Palavras Mágicas
            </div>
          </div>
        </div>
        <button class="modal-close-btn" onclick="closeRepoModal()">✕</button>
      </div>
      <div class="word-grid-scroll" id="repoWordsGrid"></div>
    </div>
  </div>

  <script>
    const WORDS_DATABASE = [
      { id: "n1-1", level: 1, word: "FADA", syllables: ["FA", "DA"], emoji: "🧚‍♀️", hint: "Ser mágico com asas que realiza desejos." },
      { id: "n1-2", level: 1, word: "LUA", syllables: ["LU", "A"], emoji: "🌙", hint: "Brilha no céu durante a noite encantada." },
      { id: "n1-3", level: 1, word: "DADO", syllables: ["DA", "DO"], emoji: "🎲", hint: "Cubinho com pontinhos para jogos divertidos." },
      { id: "n1-4", level: 1, word: "BOLO", syllables: ["BO", "LO"], emoji: "🎂", hint: "Doce fofinho de aniversário com velinhas." },
      { id: "n1-5", level: 1, word: "SAPO", syllables: ["SA", "PO"], emoji: "🐸", hint: "Verdinho que pula na lagoa e come mosquinha." },
      { id: "n1-6", level: 1, word: "GATO", syllables: ["GA", "TO"], emoji: "🐱", hint: "Felino manhoso que faz miau." },
      { id: "n1-7", level: 1, word: "BOLA", syllables: ["BO", "LA"], emoji: "⚽", hint: "Brinquedo redondo que quica e rola no chão." },
      { id: "n1-8", level: 1, word: "CASA", syllables: ["CA", "SA"], emoji: "🏡", hint: "Lar quentinho onde a família mora." },
      { id: "n1-9", level: 1, word: "NAVIO", syllables: ["NA", "VI", "O"], emoji: "🚢", hint: "Barco gigante que viaja pelo mar azul." },

    let currentLevel = 1;
    let stars = 0;
    let assemblyMode = 'letters';
    let currentIndex = 0;
    let currentWordItem = null;
    let targetUnits = [];
    let userSlots = [];
    let activeChoices = [];
    let soundEnabled = true;

    function initGame() {
      loadCurrentWord();
    }

    function selectLevel(lvl) {
      currentLevel = lvl;
      currentIndex = 0;
      loadCurrentWord();
    }

    function setAssemblyMode(mode) {
      assemblyMode = mode;
      document.getElementById('btnModeLetters').classList.toggle('active', mode === 'letters');
      document.getElementById('btnModeSyllables').classList.toggle('active', mode === 'syllables');
      loadCurrentWord();
    }

    function loadCurrentWord() {
      currentWordItem = WORDS_DATABASE[currentIndex];
      document.getElementById('wordProgressCounter').innerText = `Palavra ${currentIndex + 1} de ${WORDS_DATABASE.length}`;
      document.getElementById('illustrationSvgContainer').innerText = currentWordItem.emoji;
      document.getElementById('wordHintText').innerText = `💡 ${currentWordItem.hint}`;
      document.getElementById('hiddenPillContent').innerText = "❓ · ❓";

      if (assemblyMode === 'letters') {
        targetUnits = currentWordItem.word.split('');
      } else {
        targetUnits = [...currentWordItem.syllables];
      }

      userSlots = targetUnits.map(() => null);
      generateChoices();

      document.getElementById('feedbackBanner').style.display = 'none';
      renderSlots();
      renderChoices();
    }

    function generateChoices() {
      let pool = [...targetUnits];
      const distractors = assemblyMode === 'letters' ? ['A', 'E', 'O', 'S', 'M', 'P'] : ['BA', 'CA', 'PA', 'TA', 'RO'];
      while (pool.length < targetUnits.length + 2) {
        const rand = distractors[Math.floor(Math.random() * distractors.length)];
        if (!pool.includes(rand)) pool.push(rand);
      }
      activeChoices = pool.map((val, idx) => ({ id: idx, val, used: false })).sort(() => Math.random() - 0.5);
    }

    function renderSlots() {
      const container = document.getElementById('slotsContainer');
      container.innerHTML = '';
      targetUnits.forEach((_, idx) => {
        const div = document.createElement('div');
        div.className = 'slot-tile';
        if (userSlots[idx] === null) {
          div.classList.add('empty');
          div.innerText = `${idx + 1}º`;
        } else {
          div.classList.add('filled');
          div.innerText = userSlots[idx];
          div.onclick = () => removeSlotItem(idx);
        }
        container.appendChild(div);
      });
    }

    function renderChoices() {
      const container = document.getElementById('optionsContainer');
      container.innerHTML = '';
      activeChoices.forEach(choice => {
        const btn = document.createElement('button');
        btn.className = `cloud-btn ${choice.used ? 'used' : ''}`;
        btn.innerText = choice.val;
        btn.onclick = () => selectChoice(choice);
        container.appendChild(btn);
      });
    }

    function selectChoice(choice) {
      if (choice.used) return;
      const emptyIdx = userSlots.findIndex(s => s === null);
      if (emptyIdx !== -1) {
        userSlots[emptyIdx] = choice.val;
        choice.used = true;
        renderSlots();
        renderChoices();
        if (!userSlots.includes(null)) checkWinCondition();
      }
    }

    function removeSlotItem(idx) {
      const val = userSlots[idx];
      if (val === null) return;
      userSlots[idx] = null;
      const choice = activeChoices.find(c => c.used && c.val === val);
      if (choice) choice.used = false;
      renderSlots();
      renderChoices();
    }

    function checkWinCondition() {
      const userString = userSlots.join('');
      const targetString = targetUnits.join('');
      const banner = document.getElementById('feedbackBanner');

      if (userString === targetString) {
        if (typeof confetti === 'function') confetti({ particleCount: 70, spread: 60, origin: { y: 0.6 } });
        stars += 10;
        document.getElementById('starsDisplay').innerText = stars;
        speakText(`Parabéns! Você acertou ${currentWordItem.word}!`);
        banner.className = 'feedback-banner success';
        banner.innerHTML = `✨ Muito bem! Você conseguiu! (+10 ⭐)`;
        banner.style.display = 'flex';
      } else {
        speakText("Ops! Tente novamente, você consegue!");
        banner.className = 'feedback-banner error';
        banner.innerHTML = `⚠️ Quase lá! Reorganize as pecinhas!`;
        banner.style.display = 'flex';
      }
    }

    function resetCurrentWord() {
      loadCurrentWord();
    }

    function nextWord() {
      currentIndex = (currentIndex + 1) % WORDS_DATABASE.length;
      loadCurrentWord();
    }

    function prevWord() {
      currentIndex = (currentIndex - 1 + WORDS_DATABASE.length) % WORDS_DATABASE.length;
      loadCurrentWord();
    }

    function speakText(text) {
      if (!soundEnabled || !('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'pt-BR';
      u.rate = 0.9;
      window.speechSynthesis.speak(u);
    }

    function speakCurrentWord() {
      speakText(currentWordItem.word);
    }

    function speakPrincessAffirmation() {
      speakText("Olá! Nosso reino mágico está pronto para você jogar e aprender!");
    }

    function spellWord() {
      const letters = currentWordItem.word.split('').join('... ');
      speakText(letters);
    }

    function clapWord() {
      const syllables = currentWordItem.syllables.join('... ');
      speakText(syllables);
    }

    function handlePeekName() {
      document.getElementById('hiddenPillContent').innerText = currentWordItem.word;
      setTimeout(() => {
        document.getElementById('hiddenPillContent').innerText = "❓ · ❓";
      }, 2000);
    }

    function toggleSound() {
      soundEnabled = !soundEnabled;
      document.getElementById('soundLabel').innerText = soundEnabled ? 'Som' : 'Mudo';
    }

    function openRepoModal() {
      const overlay = document.getElementById('repoModalOverlay');
      const grid = document.getElementById('repoWordsGrid');
      grid.innerHTML = '';
      WORDS_DATABASE.forEach((w, idx) => {
        const item = document.createElement('div');
        item.className = 'repo-item-card';
        item.innerHTML = `<strong>${w.emoji} ${w.word}</strong><br><small>${w.syllables.join('-')}</small>`;
        item.onclick = () => {
          currentIndex = idx;
          loadCurrentWord();
          closeRepoModal();
        };
        grid.appendChild(item);
      });
      overlay.classList.add('open');
    }

    function closeRepoModal() {
      document.getElementById('repoModalOverlay').classList.remove('open');
    }

    function closeRepoModalOnBackdrop(e) {
      if (e.target.id === 'repoModalOverlay') closeRepoModal();
    }

    document.addEventListener("DOMContentLoaded", initGame);
  </script>
