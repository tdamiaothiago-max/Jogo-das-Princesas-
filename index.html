<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reino Silábico Encantado - Princesa Alice 👑</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Quicksand:wght@600;700&display=swap" rel="stylesheet">
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        display: ['Fredoka', 'sans-serif'],
                        sans: ['Quicksand', 'sans-serif'],
                    },
                    boxShadow: {
                        'tactile': '0 6px 0 rgba(0, 0, 0, 0.1)',
                        'tactile-pink': '0 6px 0 #f472b6',
                        'tactile-purple': '0 6px 0 #c084fc',
                        'tactile-green': '0 6px 0 #34d399',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Quicksand', sans-serif;
            background: linear-gradient(135deg, #fce7f3 0%, #f3e8ff 50%, #e0f2fe 100%);
            min-height: 100vh;
        }
        .font-display { font-family: 'Fredoka', cursive; }
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }
        .animate-float { animation: float 3s ease-in-out infinite; }
    </style>
</head>
<body class="flex flex-col items-center justify-center p-3 sm:p-6 min-h-screen">

    <!-- Container Principal do Jogo -->
    <div class="w-full max-w-4xl bg-white/90 backdrop-blur-md border-4 border-pink-200 rounded-3xl p-4 sm:p-8 shadow-2xl shadow-pink-200/50 relative">
        
        <!-- Cabeçalho / Barra Superior -->
        <div class="flex flex-wrap items-center justify-between gap-3 mb-6 pb-4 border-b border-pink-100">
            <h1 class="text-xl sm:text-3xl font-display font-bold text-pink-500 flex items-center gap-2">
                <span>👑</span> Reino Silábico Encantado
            </h1>
            
            <div class="flex items-center gap-3">
                <div class="bg-amber-50 border-2 border-amber-200 px-4 py-1.5 rounded-full flex items-center gap-2 font-display text-amber-600 font-bold text-lg shadow-sm">
                    <span>⭐</span> <span id="stars-count">0</span>
                </div>
                <button onclick="toggleAudio()" id="audio-btn" class="bg-pink-100 hover:bg-pink-200 text-pink-600 font-bold px-3 py-1.5 rounded-xl text-sm border border-pink-300 transition-all cursor-pointer">
                    🔊 Som ON
                </button>
            </div>
        </div>

        <!-- Seletor de Nível -->
        <div class="grid grid-cols-3 gap-2 mb-6">
            <button onclick="mudarNivel(1)" id="lvl-1" class="py-2.5 px-2 rounded-2xl font-display text-xs sm:text-sm font-bold border-2 transition-all cursor-pointer bg-gradient-to-r from-emerald-400 to-teal-500 text-white border-emerald-300 shadow-tactile-green scale-102">
                🌱 Nível 1: Sílabas Simples
            </button>
            <button onclick="mudarNivel(2)" id="lvl-2" class="py-2.5 px-2 rounded-2xl font-display text-xs sm:text-sm font-bold border-2 transition-all cursor-pointer bg-white text-slate-600 border-pink-200 hover:bg-pink-50">
                🦄 Nível 2: Sílabas Complexas
            </button>
            <button onclick="mudarNivel(3)" id="lvl-3" class="py-2.5 px-2 rounded-2xl font-display text-xs sm:text-sm font-bold border-2 transition-all cursor-pointer bg-white text-slate-600 border-pink-200 hover:bg-pink-50">
                ✨ Nível 3: Desafios Mágicos
            </button>
        </div>

        <!-- Seletor de Modo: Letras vs Sílabas -->
        <div class="flex justify-center gap-3 mb-6">
            <button onclick="mudarModo('letras')" id="mode-letras" class="px-4 py-2 rounded-xl font-display text-xs sm:text-sm font-bold transition-all cursor-pointer bg-pink-500 text-white shadow-tactile-pink">
                🔤 Por Letras
            </button>
            <button onclick="mudarModo('silabas')" id="mode-silabas" class="px-4 py-2 rounded-xl font-display text-xs sm:text-sm font-bold transition-all cursor-pointer bg-white text-slate-600 border border-pink-200 hover:bg-pink-50">
                🧩 Por Sílabas
            </button>
        </div>

        <!-- Área Principal de Aprendizado -->
        <div class="grid grid-cols-1 md:grid-cols-12 gap-6 items-center">
            
            <!-- Coluna Esquerda: Mascote / Imagem -->
            <div class="md:col-span-4 flex flex-col items-center justify-center p-6 bg-pink-50/60 border-2 border-pink-100 rounded-3xl text-center">
                <div class="text-8xl select-none animate-float cursor-pointer transform hover:scale-110 transition-transform mb-3" id="emoji-display" onclick="falarPalavra()">
                    🧚‍♀️
                </div>
                <button onclick="falarPalavra()" class="bg-purple-500 hover:bg-purple-600 text-white font-display font-bold px-5 py-2.5 rounded-2xl shadow-tactile-purple transition-all flex items-center gap-2 cursor-pointer text-sm">
                    🔊 Ouvir Palavra
                </button>
            </div>

            <!-- Coluna Direita: Slots e Botões de Seleção -->
            <div class="md:col-span-8 flex flex-col items-center">
                
                <!-- Palavra Formada (Slots) -->
                <div class="w-full mb-6">
                    <p class="text-xs font-bold uppercase tracking-wider text-pink-500 mb-2 text-center" id="slot-title">
                        Sua Palavra (Letras):
                    </p>
                    <div id="slots-container" class="flex flex-wrap items-center justify-center gap-2 sm:gap-3 min-h-[76px] p-3 rounded-2xl bg-gradient-to-r from-pink-50 via-purple-50 to-pink-50 border-2 border-dashed border-pink-300 shadow-inner">
                        <!-- Gerado via JS -->
                    </div>
                </div>

                <!-- Nuvens/Opções de Escolha -->
                <div class="w-full mb-4">
                    <p class="text-xs font-bold uppercase tracking-wider text-purple-500 mb-3 text-center">
                        Toque nas opções mágicas:
                    </p>
                    <div id="options-container" class="flex flex-wrap items-center justify-center gap-2.5 sm:gap-3">
                        <!-- Gerado via JS -->
                    </div>
                </div>

            </div>
        </div>

        <!-- Feedback e Mensagens -->
        <div id="feedback-area" class="mt-6 min-h-[48px] flex items-center justify-center text-center font-display font-bold text-base sm:text-lg"></div>

        <!-- Botões de Ação na Base -->
        <div class="flex justify-center items-center gap-3 mt-4 pt-4 border-t border-pink-100">
            <button onclick="limpar()" class="bg-slate-100 hover:bg-slate-200 text-slate-600 font-display font-bold px-5 py-2.5 rounded-2xl transition-all cursor-pointer text-sm">
                🧹 Limpar
            </button>
            <button onclick="proximaPalavra()" id="next-btn" class="bg-emerald-500 hover:bg-emerald-600 text-white font-display font-bold px-7 py-2.5 rounded-2xl shadow-tactile-green transition-all cursor-pointer text-base hidden animate-bounce">
                Próxima Palavra ➔
            </button>
        </div>

    </div>

    <script>
        const palavrasBD = [
            { palavra: "FADA", silabas: ["FA", "DA"], emoji: "🧚‍♀️", level: 1 },
            { palavra: "COROA", silabas: ["CO", "RO", "A"], emoji: "👑", level: 1 },
            { palavra: "CASTELO", silabas: ["CAS", "TE", "LO"], emoji: "🏰", level: 2 },
            { palavra: "DOCE", silabas: ["DO", "CE"], emoji: "🍬", level: 1 },
            { palavra: "PRINCESA", silabas: ["PRIN", "CE", "SA"], emoji: "👸", level: 2 },
            { palavra: "UNICÓRNIO", silabas: ["U", "NI", "CÓR", "NIO"], emoji: "🦄", level: 3 }
        ];

        let indiceAtual = 0;
        let nivelAtual = 1;
        let modoAtual = 'letras'; // 'letras' ou 'silabas'
        let respostaUsuario = [];
        let estrelas = 0;
        let somAtivo = true;

        function carregarJogo() {
            const item = palavrasBD[indiceAtual];
            document.getElementById('emoji-display').textContent = item.emoji;
            respostaUsuario = [];
            document.getElementById('feedback-area').textContent = '';
            document.getElementById('next-btn').classList.add('hidden');

            const targetUnits = modoAtual === 'letras' ? item.palavra.split('') : item.silabas;
            
            // Desenhar Slots
            const slotsContainer = document.getElementById('slots-container');
            slotsContainer.innerHTML = '';
            targetUnits.forEach((_, idx) => {
                const slot = document.createElement('div');
                slot.className = `min-w-[48px] h-14 sm:h-16 px-2 rounded-2xl font-display font-extrabold text-2xl border-2 border-dashed border-pink-300 bg-white/80 text-pink-300 flex items-center justify-center cursor-pointer transition-all`;
                slot.textContent = idx + 1 + "º";
                slot.onclick = () => removerItem(idx);
                slot.id = `slot-${idx}`;
                slotsContainer.appendChild(slot);
            });

            // Gerar Opções Embaralhadas
            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';

            let opcoes = [...targetUnits];
            // Se for nível mais difícil, adiciona letras/sílabas extras
            if (nivelAtual >= 2) {
                const extras = modoAtual === 'letras' ? ['X', 'M', 'P', 'L'] : ['LA', 'BO', 'DE'];
                opcoes.push(extras[Math.floor(Math.random() * extras.length)]);
            }

            opcoes.sort(() => Math.random() - 0.5);

            opcoes.forEach((opcao, idx) => {
                const btn = document.createElement('button');
                btn.className = `px-5 py-3 rounded-2xl font-display font-extrabold text-xl sm:text-2xl bg-white text-pink-600 border-2 border-pink-200 shadow-tactile-pink hover:scale-105 active:scale-95 transition-all cursor-pointer`;
                btn.textContent = modoAtual === 'silabas' ? `☁️ ${opcao}` : opcao;
                btn.id = `opt-${idx}`;
                btn.onclick = () => selecionarItem(opcao, btn);
                optionsContainer.appendChild(btn);
            });

            if (somAtivo) falarPalavra();
        }

        function selecionarItem(val, btn) {
            const item = palavrasBD[indiceAtual];
            const targetUnits = modoAtual === 'letras' ? item.palavra.split('') : item.silabas;

            if (respostaUsuario.length < targetUnits.length) {
                falarTexto(val);
                respostaUsuario.push(val);
                btn.disabled = true;
                btn.classList.add('opacity-30', 'scale-90');

                atualizarSlots();

                if (respostaUsuario.length === targetUnits.length) {
                    verificarResposta();
                }
            }
        }

        function atualizarSlots() {
            const item = palavrasBD[indiceAtual];
            const targetUnits = modoAtual === 'letras' ? item.palavra.split('') : item.silabas;

            targetUnits.forEach((_, idx) => {
                const slot = document.getElementById(`slot-${idx}`);
                if (respostaUsuario[idx]) {
                    slot.textContent = respostaUsuario[idx];
                    slot.className = `min-w-[48px] h-14 sm:h-16 px-3 rounded-2xl font-display font-extrabold text-2xl bg-gradient-to-r from-pink-500 to-purple-500 text-white shadow-tactile-pink flex items-center justify-center cursor-pointer transition-all scale-105`;
                } else {
                    slot.textContent = idx + 1 + "º";
                    slot.className = `min-w-[48px] h-14 sm:h-16 px-2 rounded-2xl font-display font-extrabold text-2xl border-2 border-dashed border-pink-300 bg-white/80 text-pink-300 flex items-center justify-center cursor-pointer transition-all`;
                }
            });
        }

        function verificarResposta() {
            const item = palavrasBD[indiceAtual];
            const correto = modoAtual === 'letras' 
                ? respostaUsuario.join('') === item.palavra 
                : respostaUsuario.join('') === item.silabas.join('');

            const feedback = document.getElementById('feedback-area');

            if (correto) {
                feedback.innerHTML = `<span class="text-emerald-600 animate-bounce">✨ Incrível, Princesa Alice! Você acertou! ✨ (+10 ⭐)</span>`;
                estrelas += 10;
                document.getElementById('stars-count').textContent = estrelas;
                document.getElementById('next-btn').classList.remove('hidden');

                if (typeof confetti === 'function') {
                    confetti({ particleCount: 80, spread: 70, origin: { y: 0.6 } });
                }

                falarTexto("Parabéns Princesa Alice! Você acertou " + item.palavra);
            } else {
                feedback.innerHTML = `<span class="text-rose-500 animate-pulse">Ops! Quase lá! Tente de novo 🪄</span>`;
                falarTexto("Quase lá! Tente novamente.");
            }
        }

        function limpar() {
            carregarJogo();
        }

        function proximaPalavra() {
            indiceAtual = (indiceAtual + 1) % palavrasBD.length;
            carregarJogo();
        }

        function mudarNivel(lvl) {
            nivelAtual = lvl;
            [1, 2, 3].forEach(i => {
                const btn = document.getElementById(`lvl-${i}`);
                if (i === lvl) {
                    btn.className = `py-2.5 px-2 rounded-2xl font-display text-xs sm:text-sm font-bold border-2 transition-all cursor-pointer bg-gradient-to-r from-emerald-400 to-teal-500 text-white border-emerald-300 shadow-tactile-green scale-102`;
                } else {
                    btn.className = `py-2.5 px-2 rounded-2xl font-display text-xs sm:text-sm font-bold border-2 transition-all cursor-pointer bg-white text-slate-600 border-pink-200 hover:bg-pink-50`;
                }
            });
            carregarJogo();
        }

        function mudarModo(modo) {
            modoAtual = modo;
            document.getElementById('slot-title').textContent = modo === 'letras' ? "Sua Palavra (Letras):" : "Sua Palavra (Sílabas):";
            
            document.getElementById('mode-letras').className = modo === 'letras' 
                ? 'px-4 py-2 rounded-xl font-display text-xs sm:text-sm font-bold transition-all cursor-pointer bg-pink-500 text-white shadow-tactile-pink'
                : 'px-4 py-2 rounded-xl font-display text-xs sm:text-sm font-bold transition-all cursor-pointer bg-white text-slate-600 border border-pink-200 hover:bg-pink-50';
            
            document.getElementById('mode-silabas').className = modo === 'silabas' 
                ? 'px-4 py-2 rounded-xl font-display text-xs sm:text-sm font-bold transition-all cursor-pointer bg-purple-500 text-white shadow-tactile-purple'
                : 'px-4 py-2 rounded-xl font-display text-xs sm:text-sm font-bold transition-all cursor-pointer bg-white text-slate-600 border border-pink-200 hover:bg-pink-50';

            carregarJogo();
        }

        function falarTexto(txt) {
            if (somAtivo && 'speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const u = new SpeechSynthesisUtterance(txt);
                u.lang = 'pt-BR';
                u.rate = 0.9;
                window.speechSynthesis.speak(u);
            }
        }

        function falarPalavra() {
            falarTexto(palavrasBD[indiceAtual].palavra);
        }

        function toggleAudio() {
            somAtivo = !somAtivo;
            document.getElementById('audio-btn').textContent = somAtivo ? "🔊 Som ON" : "🔇 Som OFF";
        }

        window.onload = carregarJogo;
    </script>
</body>
</html>
