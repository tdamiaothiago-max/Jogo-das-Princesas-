<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>O Reino Silábico da Princesa Alice</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Quicksand:wght@500;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #fce7f3 0%, #f3e8ff 50%, #e0f2fe 100%);
      --pink-primary: #ec4899;
      --pink-dark: #db2777;
      --purple-primary: #a855f7;
      --amber-gold: #f59e0b;
      --emerald-green: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      font-family: 'Quicksand', sans-serif;
      background: linear-gradient(rgba(252, 231, 243, 0.85), rgba(224, 242, 254, 0.85)), 
                  url('https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=1920') no-repeat center center fixed;
      background-size: cover;
      height: 100vh;
      max-height: 100vh;
      width: 100vw;
      overflow: hidden;
      color: #334155;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      padding: 6px 12px;
    }

    .ambient-deco {
      position: fixed;
      pointer-events: none;
      z-index: 1;
      opacity: 0.35;
      animation: float 4s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-10px) rotate(3deg); }
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(8px);
      border: 1.5px solid rgba(244, 114, 182, 0.5);
      border-radius: 16px;
      padding: 6px 14px;
      max-width: 1050px;
      width: 100%;
      margin: 0 auto;
      z-index: 10;
      flex-shrink: 0;
      box-shadow: 0 4px 15px rgba(236, 72, 153, 0.15);
    }
    .top-brand {
      display: flex;
      align-items: center;
      gap: 6px;
      font-family: 'Fredoka', cursive;
      font-weight: 700;
      font-size: 1.15rem;
      color: #ec4899;
    }
    .top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .score-badge {
      display: flex;
      align-items: center;
      gap: 5px;
      background: #fef3c7;
      border: 1.5px solid #f59e0b;
      padding: 3px 10px;
      border-radius: 12px;
      font-family: 'Fredoka', cursive;
      font-weight: 700;
      color: #b45309;
      font-size: 0.95rem;
    }
    .icon-btn {
      background: #fdf2f8;
      border: 1px solid #fbcfe8;
      border-radius: 12px;
      padding: 5px 10px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 700;
      color: #be185d;
      transition: all 0.15s;
    }
    .icon-btn:hover { background: #fce7f3; }
    .icon-btn:active { transform: scale(0.95); }

    .level-bar {
      display: flex;
      gap: 8px;
      max-width: 1050px;
      width: 100%;
      margin: 4px auto;
      z-index: 10;
      flex-shrink: 0;
    }
    .level-btn {
      flex: 1;
      padding: 8px 10px;
      border-radius: 14px;
      border: 2px solid #fbcfe8;
      background: rgba(255, 255, 255, 0.95);
      cursor: pointer;
      font-family: 'Fredoka', cursive;
      font-weight: 700;
      font-size: 0.9rem;
      color: #475569;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.15s;
    }
    .level-btn.active.lvl1 {
      background: linear-gradient(135deg, #10b981, #059669);
      color: white;
      border-color: #059669;
      box-shadow: 0 4px 0 #047857;
    }
    .level-btn.active.lvl2 {
      background: linear-gradient(135deg, #a855f7, #ec4899);
      color: white;
      border-color: #9333ea;
      box-shadow: 0 4px 0 #7e22ce;
    }
    .level-btn.active.lvl3 {
      background: linear-gradient(135deg, #f59e0b, #ea580c);
      color: white;
      border-color: #d97706;
      box-shadow: 0 4px 0 #b45309;
    }

    .stage-wrapper {
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      max-width: 1050px;
      width: 100%;
      margin: 0 auto;
      z-index: 10;
      overflow: hidden;
    }
    .game-card {
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(12px);
      border: 3px solid #fbcfe8;
      border-radius: 24px;
      padding: 14px 20px;
      box-shadow: 0 15px 35px -5px rgba(236, 72, 153, 0.35);
      width: 100%;
      height: 100%;
      max-height: 530px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
    }

    .card-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 6px;
      border-bottom: 1px solid #fce7f3;
      flex-shrink: 0;
    }
    .nav-arrow {
      background: #fdf2f8;
      border: 1px solid #fbcfe8;
      border-radius: 10px;
      width: 34px;
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      color: #be185d;
      cursor: pointer;
      transition: all 0.15s;
    }
    .nav-arrow:hover { background: #fce7f3; }
    .nav-arrow:active { transform: scale(0.9); }
    .word-counter {
      font-family: 'Fredoka', cursive;
      font-size: 0.9rem;
      font-weight: 700;
      color: #9333ea;
      background: #f3e8ff;
      padding: 3px 12px;
      border-radius: 12px;
      border: 1px solid #e9d5ff;
    }

    .stage-grid {
      display: grid;
      grid-template-columns: 290px 1fr;
      gap: 16px;
      align-items: center;
      height: 100%;
      min-height: 0;
      padding: 4px 0;
    }
    @media (max-width: 768px) {
      .stage-grid {
        grid-template-columns: 1fr;
        grid-template-rows: auto 1fr;
        gap: 8px;
      }
    }

    .left-panel {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(to bottom, #fdf2f8, #f5f3ff);
      border: 1.5px solid #fbcfe8;
      border-radius: 18px;
      padding: 10px;
      height: 100%;
      max-height: 430px;
    }
    .unit-mode-toggle {
      display: flex;
      width: 100%;
      gap: 4px;
      margin-bottom: 8px;
    }
    .mode-btn {
      flex: 1;
      padding: 5px;
      border-radius: 8px;
      border: 1px solid #fbcfe8;
      background: white;
      font-size: 0.75rem;
      font-weight: 700;
      color: #64748b;
      cursor: pointer;
      transition: all 0.15s;
    }
    .mode-btn.active {
      background: linear-gradient(to right, #ec4899, #a855f7);
      color: white;
      border-color: #ec4899;
    }

    .illustration-frame {
      width: 170px;
      height: 170px;
      background: linear-gradient(135deg, #f472b6, #c084fc, #fbbf24);
      padding: 5px;
      border-radius: 26px;
      box-shadow: 0 8px 24px rgba(236, 72, 153, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      cursor: pointer;
      margin-bottom: 8px;
      transition: transform 0.25s;
      font-size: 5rem;
    }
    .illustration-frame:hover { transform: scale(1.04); }
    .illustration-frame:active { transform: scale(0.96); }
    .illustration-badge {
      position: absolute;
      bottom: 4px;
      right: 4px;
      background: rgba(255, 255, 255, 0.95);
      border: 1px solid #fbcfe8;
      border-radius: 50%;
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.9rem;
    }

    .listen-btn {
      background: linear-gradient(135deg, #ec4899 0%, #a855f7 100%);
      color: white;
      border: none;
      border-radius: 14px;
      padding: 8px 14px;
      font-family: 'Fredoka', cursive;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 3px 0 #be185d;
      transition: all 0.15s;
      width: 100%;
      max-width: 210px;
      justify-content: center;
    }
    .listen-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #be185d; }
    .word-hint {
      font-size: 0.78rem;
      color: #64748b;
      text-align: center;
      margin-top: 6px;
      line-height: 1.2;
      font-weight: 600;
    }

    .right-panel {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 12px;
      height: 100%;
    }

    .slots-box {
      background: linear-gradient(to right, rgba(253, 242, 248, 0.8), rgba(245, 243, 255, 0.8));
      border: 2px dashed #f472b6;
      border-radius: 18px;
      padding: 12px 14px;
      text-align: center;
    }
    .slots-title {
      font-family: 'Fredoka', cursive;
      font-size: 0.85rem;
      font-weight: 700;
      color: #ec4899;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }
    .slots-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      min-height: 56px;
    }
    .slot-item {
      min-width: 65px;
      height: 56px;
      padding: 0 12px;
      border-radius: 14px;
      font-family: 'Fredoka', cursive;
      font-size: 1.7rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }
    .slot-item.empty {
      border: 2px dashed #f472b6;
      background: white;
      color: #f472b6;
      opacity: 0.5;
      font-size: 0.85rem;
    }
    .slot-item.filled {
      background: linear-gradient(135deg, #ec4899, #a855f7);
      color: white;
      box-shadow: 0 4px 0 #be185d;
      cursor: pointer;
    }

    .choices-box {
      background: rgba(255, 255, 255, 0.8);
      border: 1px solid #f3e8ff;
      border-radius: 18px;
      padding: 12px 14px;
      text-align: center;
    }
    .choices-title {
      font-family: 'Fredoka', cursive;
      font-size: 0.85rem;
      font-weight: 700;
      color: #9333ea;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }
    .choices-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
    }
    .choice-cloud {
      background: white;
      border: 2px solid #f472b6;
      border-radius: 16px;
      padding: 8px 18px;
      font-family: 'Fredoka', cursive;
      font-size: 1.5rem;
      font-weight: 700;
      color: #db2777;
      cursor: pointer;
      box-shadow: 0 4px 0 #f472b6;
      transition: all 0.15s;
    }
    .choice-cloud:hover { background: #fdf2f8; transform: translateY(-2px); }
    .choice-cloud:active { transform: translateY(3px); box-shadow: 0 1px 0 #f472b6; }
    .choice-cloud.used {
      opacity: 0.25;
      pointer-events: none;
      transform: scale(0.9);
      box-shadow: none;
    }

    .feedback-banner {
      padding: 10px 14px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .feedback-banner.success {
      background: #ecfdf5;
      border: 2px solid #34d399;
      color: #065f46;
    }
    .feedback-banner.error {
      background: #fff1f2;
      border: 2px solid #fda4af;
      color: #9f1239;
    }
    .next-btn {
      background: linear-gradient(to right, #10b981, #059669);
      color: white;
      border: none;
      border-radius: 12px;
      padding: 6px 14px;
      font-family: 'Fredoka', cursive;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 3px 0 #047857;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .word-strip {
      max-width: 1050px;
      width: 100%;
      margin: 4px auto 0 auto;
      background: rgba(255, 255, 255, 0.9);
      border: 1.5px solid #fbcfe8;
      border-radius: 14px;
      padding: 5px 8px;
      display: flex;
      align-items: center;
      gap: 6px;
      overflow-x: auto;
      flex-shrink: 0;
      scrollbar-width: none;
      box-shadow: 0 4px 12px rgba(236, 72, 153, 0.1);
    }
    .word-strip::-webkit-scrollbar { display: none; }
    .strip-chip {
      background: white;
      border: 1px solid #fbcfe8;
      border-radius: 10px;
      padding: 4px 10px;
      font-size: 0.8rem;
      font-weight: 700;
      color: #475569;
      cursor: pointer;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: all 0.15s;
    }
    .strip-chip.active {
      background: linear-gradient(to right, #ec4899, #a855f7);
      color: white;
      border-color: #ec4899;
      transform: scale(1.05);
      box-shadow: 0 2px 6px rgba(236, 72, 153, 0.3);
    }
  </style>
</head>
<body>
  <div class="ambient-deco" style="top: 15px; left: 15px; font-size: 2.5rem;">☁️</div>
  <div class="ambient-deco" style="top: 25px; right: 25px; font-size: 2.2rem;">✨</div>
  <div class="ambient-deco" style="bottom: 25px; left: 20px; font-size: 2.5rem;">🧚‍♀️</div>
  <div class="ambient-deco" style="bottom: 25px; right: 20px; font-size: 2.5rem;">🦄</div>

  <header class="top-bar">
    <div class="top-brand">
      <span>👑</span>
      <span>O Reino Silábico da Princesa Alice</span>
    </div>
    <div class="top-actions">
      <div class="score-badge">
        <span>⭐</span>
        <span id="starsCount">0</span>
      </div>
      <button class="icon-btn" onclick="toggleSound()">
        <span id="soundIcon">🔊 Som</span>
      </button>
      <button class="icon-btn" onclick="speakPrincessMessage()">
        <span>👑 Princesa</span>
      </button>
    </div>
  </header>

  <div class="level-bar">
    <button class="level-btn lvl1 active" id="lvlBtn1" onclick="switchLevel(1)">
      <span>🌸 Nível 1: Sílabas Simples</span>
    </button>
    <button class="level-btn lvl2" id="lvlBtn2" onclick="switchLevel(2)">
      <span>🦄 Nível 2: Sílabas Complexas</span>
    </button>
    <button class="level-btn lvl3" id="lvlBtn3" onclick="switchLevel(3)">
      <span>⭐ Nível 3: Complete a Sílaba</span>
    </button>
  </div>

  <div class="stage-wrapper">
    <main class="game-card">
      <div class="card-nav">
        <button class="nav-arrow" onclick="prevWord()">❮</button>
        <span class="word-counter" id="wordCounter">Palavra 1 de 12</span>
        <button class="nav-arrow" onclick="nextWord()">❯</button>
      </div>

      <div class="stage-grid">
        <div class="left-panel">
          <div class="unit-mode-toggle" id="unitModeToggle">
            <button class="mode-btn active" id="btnModeLetras" onclick="setUnitMode('letras')">🔤 Por Letras</button>
            <button class="mode-btn" id="btnModeSilabas" onclick="setUnitMode('silabas')">🧩 Por Sílabas</button>
          </div>

          <div class="illustration-frame" onclick="speakCurrentWord()" title="Toque para ouvir a palavra!">
            <span id="illustrationEmoji">🧚‍♀️</span>
            <div class="illustration-badge">✨</div>
          </div>

          <button class="listen-btn" onclick="speakCurrentWord()">
            <span>🔊</span>
            <span id="listenBtnLabel">Ouvir Palavra</span>
          </button>

          <p class="word-hint" id="wordHint">Dica mágica...</p>
        </div>

        <div class="right-panel">
          <div class="slots-box">
            <div class="slots-title" id="slotsTitle">SUA PALAVRA:</div>
            <div class="slots-grid" id="slotsContainer"></div>
          </div>

          <div class="choices-box">
            <div class="choices-title" id="choicesTitle">TOQUE PARA ESCOLHER:</div>
            <div class="choices-grid" id="choicesGrid"></div>
          </div>

          <div id="feedbackBanner" class="feedback-banner" style="display: none;">
            <div id="feedbackMsg" style="font-weight: 700; font-size: 0.95rem;"></div>
            <button class="next-btn" id="feedbackNextBtn" onclick="nextWord()">
              <span>Próxima</span>
              <span>❯</span>
            </button>
          </div>
        </div>
      </div>
    </main>
  </div>

  <div class="word-strip" id="wordStrip"></div>

  <script>
    let soundEnabled = true;

    const WORDS = [
      { id: 'fada', word: 'FADA', syllables: ['FA', 'DA'], emoji: '🧚‍♀️', level: 1, hint: 'Fadinha com asinhas brilhantes.' },
      { id: 'coroa', word: 'COROA', syllables: ['CO', 'RO', 'A'], emoji: '👑', level: 1, hint: 'Acessório dourado da realeza.' },
      { id: 'castelo', word: 'CASTELO', syllables: ['CAS', 'TE', 'LO'], emoji: '🏰', level: 1, hint: 'Palácio com torres altas.' },
      { id: 'doce', word: 'DOCE', syllables: ['DO', 'CE'], emoji: '🍭', level: 1, hint: 'Guloseima saborosa e docinha.' },
      { id: 'lua', word: 'LUA', syllables: ['LU', 'A'], emoji: '🌙', level: 1, hint: 'Ilumina o céu à noite.' },
      { id: 'dado', word: 'DADO', syllables: ['DA', 'DO'], emoji: '🎲', level: 1, hint: 'Cubinho numérico para jogar.' },
      { id: 'nuvem', word: 'NUVEM', syllables: ['NU', 'VEM'], emoji: '☁️', level: 1, hint: 'Flutua no céu azul.' },
      { id: 'sapo', word: 'SAPO', syllables: ['SA', 'PO'], emoji: '🐸', level: 1, hint: 'Adora pular na lagoa.' },
      { id: 'bolo', word: 'BOLO', syllables: ['BO', 'LO'], emoji: '🎂', level: 1, hint: 'Bolo de aniversário fofinho.' },
      { id: 'gato', word: 'GATO', syllables: ['GA', 'TO'], emoji: '🐱', level: 1, hint: 'Bichinho fofo que faz miau.' },
      { id: 'bala', word: 'BALA', syllables: ['BA', 'LA'], emoji: '🍬', level: 1, hint: 'Docinho colorido.' },
      { id: 'pato', word: 'PATO', syllables: ['PA', 'TO'], emoji: '🦆', level: 1, hint: 'Nada no laguinho e faz quá-quá.' },
      { id: 'princesa', word: 'PRINCESA', syllables: ['PRIN', 'CE', 'SA'], emoji: '👸', level: 2, hint: 'Vive em um lindo castelo.' },
      { id: 'unicornio', word: 'UNICÓRNIO', syllables: ['U', 'NI', 'CÓR', 'NIO'], emoji: '🦄', level: 2, hint: 'Cavalo com chifre mágico.' },
      { id: 'algodao', word: 'ALGODÃO', syllables: ['AL', 'GO', 'DÃO'], emoji: '☁️', level: 2, hint: 'Algodão doce cor-de-rosa.' },
      { id: 'borboleta', word: 'BORBOLETA', syllables: ['BOR', 'BO', 'LE', 'TA'], emoji: '🦋', level: 2, hint: 'Asas coloridas no jardim.' },
      { id: 'estrela', word: 'ESTRELA', syllables: ['ES', 'TRE', 'LA'], emoji: '⭐', level: 2, hint: 'Ponto brilhante no céu.' },
      { id: 'chocolate', word: 'CHOCOLATE', syllables: ['CHO', 'CO', 'LA', 'TE'], emoji: '🍫', level: 2, hint: 'Doce cremoso e irresistível.' }
    ];

    let currentLevel = 1;
    let stars = 0;
    let unitMode = 'letras';
    let currentIndex = 0;
    let filteredWords = [];
    let currentWordItem = null;
    let targetUnits = [];
    let userSlots = [];
    let activeChoices = [];

    function initGame() {
      filterWordsByLevel();
      loadCurrentWord();
      renderWordStrip();
    }

    function filterWordsByLevel() {
      if (currentLevel === 3) {
        filteredWords = [...WORDS];
      } else {
        filteredWords = WORDS.filter(w => w.level === currentLevel);
      }
      if (currentIndex >= filteredWords.length) currentIndex = 0;
    }

    function switchLevel(lvl) {
      currentLevel = lvl;
      currentIndex = 0;
      [1, 2, 3].forEach(i => {
        document.getElementById(`lvlBtn${i}`).classList.toggle('active', i === lvl);
      });
      filterWordsByLevel();
      loadCurrentWord();
      renderWordStrip();
    }

    function setUnitMode(mode) {
      unitMode = mode;
      document.getElementById('btnModeLetras').classList.toggle('active', mode === 'letras');
      document.getElementById('btnModeSilabas').classList.toggle('active', mode === 'silabas');
      loadCurrentWord();
    }

    function loadCurrentWord() {
      currentWordItem = filteredWords[currentIndex] || WORDS[0];
      document.getElementById('wordCounter').innerText = `Palavra ${currentIndex + 1} de ${filteredWords.length}`;
      document.getElementById('illustrationEmoji').innerText = currentWordItem.emoji;
      document.getElementById('wordHint').innerText = currentWordItem.hint;

      if (unitMode === 'letras') {
        targetUnits = currentWordItem.word.split('');
        document.getElementById('slotsTitle').innerText = "SUA PALAVRA:";
      } else {
        targetUnits = [...currentWordItem.syllables];
        document.getElementById('slotsTitle').innerText = "SUA PALAVRA (SÍLABAS):";
      }

      userSlots = targetUnits.map(() => null);

      generateChoices();
      document.getElementById('feedbackBanner').style.display = 'none';

      renderSlots();
      renderChoices();
      updateWordStripActive();
    }

    function generateChoices() {
      let pool = [...targetUnits];
      const distractors = unitMode === 'letras' ? ['A', 'E', 'O', 'S', 'M', 'P'] : ['BA', 'CA', 'PA', 'TA', 'RO'];
      while (pool.length < targetUnits.length + 2) {
        const rand = distractors[Math.floor(Math.random() * distractors.length)];
        if (!pool.includes(rand)) pool.push(rand);
      }
      
      activeChoices = pool.map((val, idx) => ({
        id: idx,
        val: val,
        used: false
      })).sort(() => Math.random() - 0.5);
    }

    function renderSlots() {
      const container = document.getElementById('slotsContainer');
      container.innerHTML = '';

      targetUnits.forEach((_, idx) => {
        const div = document.createElement('div');
        div.className = 'slot-item';

        if (userSlots[idx] === null) {
          div.classList.add('empty');
          div.innerText = `${idx + 1}º`;
        } else {
          div.classList.add('filled');
          div.innerText = userSlots[idx];
          div.onclick = () => removeSlotItem(idx);
        }
        container.appendChild(div);
      });
    }

    function renderChoices() {
      const grid = document.getElementById('choicesGrid');
      grid.innerHTML = '';

      activeChoices.forEach(choice => {
        const btn = document.createElement('button');
        btn.className = `choice-cloud ${choice.used ? 'used' : ''}`;
        btn.innerText = choice.val;
        btn.onclick = () => selectChoice(choice);
        grid.appendChild(btn);
      });
    }

    function selectChoice(choice) {
      if (choice.used) return;

      const emptyIdx = userSlots.findIndex(s => s === null);
      if (emptyIdx !== -1) {
        userSlots[emptyIdx] = choice.val;
        choice.used = true;
        renderSlots();
        renderChoices();

        if (!userSlots.includes(null)) {
          checkWinCondition();
        }
      }
    }

    function removeSlotItem(idx) {
      const val = userSlots[idx];
      if (val === null) return;

      userSlots[idx] = null;
      const choice = activeChoices.find(c => c.used && c.val === val);
      if (choice) choice.used = false;

      renderSlots();
      renderChoices();
    }

    function checkWinCondition() {
      const userString = userSlots.join('');
      const targetString = targetUnits.join('');

      const banner = document.getElementById('feedbackBanner');
      const msg = document.getElementById('feedbackMsg');

      if (userString === targetString) {
        if (typeof confetti === 'function') confetti({ particleCount: 80, spread: 70, origin: { y: 0.6 } });

        stars += 10;
        document.getElementById('starsCount').innerText = stars;

        speakText(`Parabéns, Princesa Alice! Você acertou ${currentWordItem.word}!`);

        banner.className = 'feedback-banner success';
        msg.innerHTML = `✨ Parabéns, Princesa Alice! Você acertou! (+10 ⭐)`;
        banner.style.display = 'flex';
      } else {
        speakText("Ops! Tente novamente, você consegue!");
        banner.className = 'feedback-banner error';
        msg.innerHTML = `⚠️ Ops! Tente trocar uma das letrinhas!`;
        banner.style.display = 'flex';
      }
    }

    function speakText(text) {
      if (!soundEnabled || !('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'pt-BR';
      u.rate = 0.9;
      window.speechSynthesis.speak(u);
    }

    function speakCurrentWord() {
      speakText(currentWordItem.word);
    }

    function speakPrincessMessage() {
      speakText("Olá Alice! Nosso reino mágico está pronto para você jogar!");
    }

    function toggleSound() {
      soundEnabled = !soundEnabled;
      document.getElementById('soundIcon').innerText = soundEnabled ? '🔊 Som' : '🔇 Mudo';
    }

    function nextWord() {
      currentIndex = (currentIndex + 1) % filteredWords.length;
      loadCurrentWord();
    }

    function prevWord() {
      currentIndex = (currentIndex - 1 + filteredWords.length) % filteredWords.length;
      loadCurrentWord();
    }

    function renderWordStrip() {
      const strip = document.getElementById('wordStrip');
      strip.innerHTML = '';
      WORDS.forEach((w, idx) => {
        const chip = document.createElement('div');
        chip.className = 'strip-chip';
        chip.id = `stripChip-${idx}`;
        chip.innerHTML = `<span>${w.emoji}</span><span>${w.word}</span>`;
        chip.onclick = () => {
          const foundIdx = filteredWords.findIndex(fw => fw.id === w.id);
          if (foundIdx !== -1) {
            currentIndex = foundIdx;
            loadCurrentWord();
          }
        };
        strip.appendChild(chip);
      });
      updateWordStripActive();
    }

    function updateWordStripActive() {
      WORDS.forEach((w, idx) => {
        const chip = document.getElementById(`stripChip-${idx}`);
        if (!chip) return;
        if (w.id === currentWordItem.id) {
          chip.classList.add('active');
        } else {
          chip.classList.remove('active');
        }
      });
    }

    // Inicialização direta imediata
    document.addEventListener("DOMContentLoaded", initGame);
    window.onload = initGame;
  </script>
</body>
</html>
