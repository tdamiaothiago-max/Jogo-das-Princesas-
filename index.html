<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>O Reino Silábico Encantado - Jogo Educativo de Sílabas</title>
  <meta name="description" content="Jogo educativo encantador para crianças aprenderem divisão silábica em português com áudio interativo, temas variados e recompensas mágicas.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Quicksand:wght@500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <style>
    :root {
      --primary: #ec4899;
      --primary-dark: #be185d;
      --secondary: #a855f7;
      --bg-image: url('https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=1920');
      --bg-overlay: linear-gradient(rgba(252, 231, 243, 0.88), rgba(224, 242, 254, 0.88));
      --card-border: #fbcfe8;
      --card-bg: rgba(255, 255, 255, 0.96);
      --badge-bg: #fdf2f8;
      --badge-color: #be185d;
    }

    body.theme-boy {
      --primary: #0284c7;
      --primary-dark: #0369a1;
      --secondary: #10b981;
      --bg-image: url('https://images.unsplash.com/photo-1534447677768-be436bb09401?q=80&w=1920');
      --bg-overlay: linear-gradient(rgba(224, 242, 254, 0.88), rgba(209, 250, 229, 0.88));
      --card-border: #bae6fd;
      --card-bg: rgba(255, 255, 255, 0.96);
      --badge-bg: #f0f9ff;
      --badge-color: #0369a1;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      font-family: 'Quicksand', sans-serif;
      background: var(--bg-overlay), var(--bg-image) no-repeat center center fixed;
      background-size: cover;
      min-height: 100vh;
      width: 100vw;
      overflow-x: hidden;
      color: #334155;
      display: flex;
      flex-direction: column;
      position: relative;
      transition: background 0.5s ease;
    }

    .welcome-overlay {
      position: fixed;
      inset: 0;
      background: linear-gradient(rgba(15, 23, 42, 0.45), rgba(15, 23, 42, 0.55)), 
                  url('https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=1920') no-repeat center center fixed;
      background-size: cover;
      z-index: 200;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
    }

    .welcome-card {
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(16px);
      border: 4px solid #fbcfe8;
      border-radius: 32px;
      padding: 30px 24px;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.25);
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .welcome-title {
      font-family: 'Fredoka', cursive;
      font-size: 1.8rem;
      color: #334155;
    }

    .name-input-field {
      width: 100%;
      padding: 12px 16px;
      border-radius: 18px;
      border: 2.5px solid #fbcfe8;
      font-family: 'Fredoka', cursive;
      font-size: 1.2rem;
      color: #334155;
      outline: none;
    }

    .character-selection-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .character-btn {
      background: #ffffff;
      border: 3px solid #e2e8f0;
      border-radius: 24px;
      padding: 18px 12px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .character-avatar { font-size: 4rem; }
    .character-label { font-family: 'Fredoka', cursive; font-size: 1.25rem; font-weight: 700; }

    .app-container {
      position: relative;
      z-index: 10;
      max-width: 1200px;
      margin: 0 auto;
      padding: 8px 12px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-height: 100vh;
      justify-content: space-between;
    }

    .header-bar {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(8px);
      border: 1.5px solid var(--card-border);
      border-radius: 20px;
      padding: 6px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .brand-title {
      font-family: 'Fredoka', cursive;
      font-weight: 700;
      font-size: 1.15rem;
      color: var(--primary-dark);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .header-actions { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }

    .badge-star {
      background: linear-gradient(135deg, #fef3c7, #fef08a);
      border: 1px solid #fcd34d;
      padding: 4px 10px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      gap: 4px;
      font-family: 'Fredoka', cursive;
      font-weight: 700;
      color: #b45309;
      cursor: pointer;
    }

    .btn-action {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      padding: 5px 10px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 0.75rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      color: #475569;
    }
    .btn-action.primary {
      background: linear-gradient(135deg, var(--secondary), var(--primary));
      color: #ffffff;
      border: none;
    }

    .theme-selector-bar {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding: 4px 2px;
    }

    .theme-chip-btn {
      background: #ffffff;
      border: 1.5px solid var(--card-border);
      border-radius: 14px;
      padding: 6px 12px;
      font-family: 'Fredoka', cursive;
      font-size: 0.8rem;
      font-weight: 600;
      color: #475569;
      cursor: pointer;
      white-space: nowrap;
    }
    .theme-chip-btn.active {
      background: var(--primary);
      color: white;
    }

    .level-selector-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
    }
    @media (min-width: 640px) {
      .level-selector-grid { grid-template-columns: repeat(4, 1fr); }
    }

    .level-card-btn {
      padding: 8px 10px;
      border-radius: 16px;
      border: 2px solid #e2e8f0;
      background: #ffffff;
      cursor: pointer;
    }
    .level-card-btn.active { background: linear-gradient(135deg, var(--secondary), var(--primary)); color: white; }

    .game-main-card {
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      border: 3px solid var(--card-border);
      border-radius: 28px;
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .card-top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }

    .nav-arrow-btn {
      background: var(--badge-bg);
      border: 1px solid var(--card-border);
      color: var(--primary-dark);
      width: 34px;
      height: 34px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-weight: bold;
    }

    .stage-layout {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
    }
    @media (min-width: 768px) {
      .stage-layout { grid-template-columns: 5fr 7fr; }
    }

    .left-panel {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: rgba(255, 255, 255, 0.8);
      padding: 12px;
      border-radius: 22px;
      border: 1px solid var(--card-border);
    }

    .illustration-frame {
      width: 260px;
      height: 240px;
      border-radius: 28px;
      background: #ffffff;
      padding: 8px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.12);
      position: relative;
    }

    .illustration-inner {
      width: 100%;
      height: 100%;
      border-radius: 22px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f8fafc;
    }

    .word-illustration-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .btn-audio-speak {
      margin-top: 8px;
      width: 100%;
      max-width: 260px;
      background: linear-gradient(135deg, var(--secondary), var(--primary));
      color: white;
      border: none;
      padding: 9px 16px;
      border-radius: 16px;
      font-family: 'Fredoka', cursive;
      font-weight: 700;
      cursor: pointer;
    }

    .right-panel { display: flex; flex-direction: column; gap: 12px; }

    .assembly-box-card {
      background: rgba(255, 255, 255, 0.9);
      border: 2px solid var(--card-border);
      border-radius: 22px;
      padding: 12px 14px;
      text-align: center;
    }

    .slots-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      min-height: 64px;
      margin-top: 6px;
    }

    .slot-tile {
      min-width: 52px;
      height: 60px;
      border-radius: 18px;
      font-family: 'Fredoka', cursive;
      font-weight: 700;
      font-size: 1.6rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .slot-tile.empty {
      background: rgba(255, 255, 255, 0.9);
      border: 2.5px dashed var(--primary);
      color: rgba(100, 116, 139, 0.4);
    }
    .slot-tile.filled {
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: white;
    }

    .options-box-card {
      background: rgba(255, 255, 255, 0.9);
      border: 2px solid #ede9fe;
      border-radius: 22px;
      padding: 12px 14px;
      text-align: center;
    }

    .options-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin-top: 8px;
    }

    .cloud-btn {
      font-family: 'Fredoka', cursive;
      font-weight: 700;
      font-size: 1.3rem;
      padding: 10px 18px;
      border-radius: 20px;
      border: 2.5px solid var(--card-border);
      background: #ffffff;
      color: var(--primary-dark);
      cursor: pointer;
    }
    .cloud-btn.used { opacity: 0.2; cursor: not-allowed; }

    .feedback-banner {
      min-height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 16px;
      font-weight: 700;
      padding: 6px 14px;
    }
    .feedback-banner.success { background: #ecfdf5; color: #065f46; border: 1.5px solid #6ee7b7; }
    .feedback-banner.error { background: #fff1f2; color: #9f1239; border: 1.5px solid #fecdd3; }
  </style>
</head>
<body>

  <div class="welcome-overlay" id="welcomeOverlay">
    <div class="welcome-card">
      <div class="welcome-title">✨ Bem-vindo ao Reino Mágico! ✨</div>

      <div style="text-align: left;">
        <label style="font-family:'Fredoka', cursive; color:#be185d; font-weight:600;">✏️ Como você se chama?</label>
        <input type="text" id="childNameInput" class="name-input-field" placeholder="Digite seu lindo nome aqui..." maxlength="20" autocomplete="off" />
      </div>

      <div style="font-family:'Fredoka', cursive; color:#64748b; font-weight:600;">Escolha quem vai jogar hoje:</div>

      <div class="character-selection-grid">
        <button class="character-btn" onclick="setGenderTheme('girl')">
          <span class="character-avatar">👸</span>
          <span class="character-label" style="color:#db2777;">Princesa</span>
        </button>
        <button class="character-btn" onclick="setGenderTheme('boy')">
          <span class="character-avatar">🤴</span>
          <span class="character-label" style="color:#0284c7;">Príncipe</span>
        </button>
      </div>
    </div>
  </div>

  <div class="app-container">

    <header class="header-bar">
      <div class="brand-title">
        <span id="brandIcon">👑</span>
        <span id="brandText">O Reino Silábico Encantado</span>
      </div>

      <div class="header-actions">
        <button class="btn-action" onclick="showWelcomeScreen()">
          <span id="avatarBtnIcon">👸</span>
          <span id="profileBtnName">Perfil</span>
        </button>

        <div class="badge-star">
          <span>⭐</span>
          <span id="starsDisplay">0</span>
        </div>
      </div>
    </header>

    <div class="theme-selector-bar" id="themeSelectorContainer"></div>

    <div class="level-selector-grid">
      <button class="level-card-btn active" id="btnLvl1" onclick="selectLevel(1)">🌸 Nível 1: Simples</button>
      <button class="level-card-btn" id="btnLvl2" onclick="selectLevel(2)">🦄 Nível 2: Complexas</button>
      <button class="level-card-btn" id="btnLvl3" onclick="selectLevel(3)">⭐ Nível 3: Desafio</button>
      <button class="level-card-btn" id="btnLvl4" onclick="selectLevel(4)">🔥 Nível 4: Polissílabas</button>
    </div>

    <main class="game-main-card">
      <div class="card-top-bar">
        <button class="nav-arrow-btn" onclick="prevWord()">◀</button>
        <div>
          <span id="currentLevelBadge" style="font-weight:bold; font-size:0.85rem;">🌸 Nível 1: Simples</span>
          <span id="wordProgressCounter" style="font-size:0.8rem; font-weight:bold; color:#64748b; margin-left:8px;">Palavra 1</span>
        </div>
        <button class="nav-arrow-btn" onclick="nextWord()">▶</button>
      </div>

      <div class="stage-layout">

        <div class="left-panel">
          <div class="illustration-frame">
            <div class="illustration-inner">
              <img id="wordIllustrationImage" class="word-illustration-img" src="" alt="Ilustração Educativa" onerror="handleImageError(this)" />
            </div>
          </div>

          <button class="btn-audio-speak" onclick="speakCurrentWord()">🔊 Ouvir Palavra</button>

          <div id="wordHintText" style="margin-top:8px; font-size:0.8rem; color:#64748b; text-align:center;">
            💡 Dica mágica...
          </div>
        </div>

        <div class="right-panel">
          <div class="assembly-box-card">
            <div style="font-size: 0.8rem; font-weight: 800; color: var(--secondary);">✨ CAMPO DE MONTAGEM DA PALAVRA:</div>
            <div class="slots-container" id="slotsContainer"></div>
          </div>

          <div class="options-box-card">
            <div style="font-size: 0.8rem; font-weight: 800; color: var(--primary-dark);">☁️ TOQUE PARA ESCOLHER:</div>
            <div class="options-container" id="optionsContainer"></div>
          </div>

          <div class="feedback-banner" id="feedbackBanner" style="display: none;"></div>

          <div style="display: flex; gap: 8px; justify-content: flex-end;">
            <button class="btn-action" onclick="resetCurrentWord()">🔄 Limpar</button>
            <button class="btn-action primary" onclick="nextWord()">Próxima ▶</button>
          </div>
        </div>

      </div>
    </main>

  </div>

  <script>
    // Gerador de imagens públicas confiáveis por palavra via Unsplash / Pixabay / SVG de backup
    function getWordImageUrl(wordKey) {
      const imageMap = {
        "FADA": "https://images.unsplash.com/photo-1534447677768-be436bb09401?w=400&q=80",
        "BOLO": "https://images.unsplash.com/photo-1578985545062-69928b1d9587?w=400&q=80",
        "DADO": "https://images.unsplash.com/photo-1522069169874-c58ec4b76be5?w=400&q=80",
        "GATO": "https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?w=400&q=80",
        "PEIXE": "https://images.unsplash.com/photo-1522069169874-c58ec4b76be5?w=400&q=80",
        "BALA": "https://images.unsplash.com/photo-1582058091505-f87a2e55a40f?w=400&q=80",
        "CARRO": "https://images.unsplash.com/photo-1568605117036-5fe5e7bab0b7?w=400&q=80",
        "LUA": "https://images.unsplash.com/photo-1532693322450-2cb5c511067d?w=400&q=80",
        "CASA": "https://images.unsplash.com/photo-1580587771525-78b9dba3b914?w=400&q=80",
        "PRINCESA": "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=400&q=80",
        "DRAGÃO": "https://images.unsplash.com/photo-1579783902614-a3fb3927b675?w=400&q=80",
        "CASTELO": "https://images.unsplash.com/photo-1524492412937-b28074a5d7da?w=400&q=80"
      };

      if (imageMap[wordKey]) return imageMap[wordKey];
      
      // Imagem alternativa ilustrativa gerada dinamicamente com o texto
      return `https://placehold.co/400x300/fbcfe8/be185d?text=${encodeURIComponent(wordKey)}`;
    }

    function handleImageError(img) {
      // Fallback em caso de falha de conexão na imagem externa
      const word = currentWordItem ? currentWordItem.word : "Reino";
      img.src = `https://placehold.co/400x300/e0f2fe/0369a1?text=${encodeURIComponent(word)}`;
    }

    const WORDS_DATABASE = [
      { id: "fada", level: 1, word: "FADA", syllables: ["FA", "DA"], hint: "Ser mágico com asas que realiza desejos." },
      { id: "bolo", level: 1, word: "BOLO", syllables: ["BO", "LO"], hint: "Doce de aniversário com velinhas." },
      { id: "dado", level: 1, word: "DADO", syllables: ["DA", "DO"], hint: "Cubinho colorido com números." },
      { id: "gato", level: 1, word: "GATO", syllables: ["GA", "TO"], hint: "Felino manhoso que faz miau." },
      { id: "peixe", level: 1, word: "PEIXE", syllables: ["PEI", "XE"], hint: "Nada alegremente no mar." },
      { id: "casa", level: 1, word: "CASA", syllables: ["CA", "SA"], hint: "Lugar onde a gente mora." },
      { id: "princesa", level: 2, word: "PRINCESA", syllables: ["PRIN", "CE", "SA"], hint: "Jovem nobre que usa tiara." },
      { id: "dragao", level: 2, word: "DRAGÃO", syllables: ["DRA", "GÃO"], hint: "Criatura mágica com asas." },
      { id: "castelo", level: 3, word: "CASTELO", syllables: ["CAS", "TE", "LO"], hint: "Palácio com grandes torres." }
    ];

    let childName = "";
    let currentGender = 'girl';
    let currentLevel = 1;
    let stars = 0;
    let currentIndex = 0;
    let currentWordItem = null;
    let targetUnits = [];
    let userSlots = [];
    let activeChoices = [];

    function setGenderTheme(gender) {
      currentGender = gender;
      const inputVal = document.getElementById('childNameInput').value.trim();
      childName = inputVal !== "" ? inputVal : (gender === 'boy' ? "Príncipe" : "Princesa");

      document.getElementById('welcomeOverlay').style.display = 'none';
      document.getElementById('profileBtnName').innerText = childName;

      if (gender === 'boy') {
        document.body.classList.add('theme-boy');
        document.getElementById('brandIcon').innerText = "🤴";
        document.getElementById('brandText').innerText = "O Reino Silábico do Príncipe";
      } else {
        document.body.classList.remove('theme-boy');
        document.getElementById('brandIcon').innerText = "👑";
        document.getElementById('brandText').innerText = "O Reino Silábico Encantado";
      }

      selectLevel(1);
    }

    function showWelcomeScreen() {
      document.getElementById('welcomeOverlay').style.display = 'flex';
    }

    function selectLevel(lvl) {
      currentLevel = lvl;
      currentIndex = 0;
      loadCurrentWord();
    }

    function loadCurrentWord() {
      const filtered = WORDS_DATABASE.filter(w => w.level === currentLevel);
      if (filtered.length === 0) return;

      currentWordItem = filtered[currentIndex % filtered.length];
      document.getElementById('wordProgressCounter').innerText = `Palavra ${currentIndex + 1} de ${filtered.length}`;
      
      const imgElem = document.getElementById('wordIllustrationImage');
      imgElem.src = getWordImageUrl(currentWordItem.word);
      
      document.getElementById('wordHintText').innerText = `💡 ${currentWordItem.hint}`;

      targetUnits = currentWordItem.word.split('');
      userSlots = targetUnits.map(() => null);

      generateChoices();
      renderSlots();
      renderChoices();
    }

    function generateChoices() {
      let pool = [...targetUnits];
      const distractors = ['A', 'E', 'O', 'S', 'M', 'P', 'R', 'T'];
      while (pool.length < targetUnits.length + 2) {
        const rand = distractors[Math.floor(Math.random() * distractors.length)];
        if (!pool.includes(rand)) pool.push(rand);
      }
      activeChoices = pool.map((val, idx) => ({ id: idx, val, used: false })).sort(() => Math.random() - 0.5);
    }

    function renderSlots() {
      const container = document.getElementById('slotsContainer');
      container.innerHTML = '';
      targetUnits.forEach((_, idx) => {
        const div = document.createElement('div');
        div.className = 'slot-tile';
        if (userSlots[idx] === null) {
          div.classList.add('empty');
          div.innerText = `${idx + 1}º`;
        } else {
          div.classList.add('filled');
          div.innerText = userSlots[idx];
          div.onclick = () => removeSlotItem(idx);
        }
        container.appendChild(div);
      });
    }

    function renderChoices() {
      const container = document.getElementById('optionsContainer');
      container.innerHTML = '';
      activeChoices.forEach(choice => {
        const btn = document.createElement('button');
        btn.className = `cloud-btn ${choice.used ? 'used' : ''}`;
        btn.innerText = choice.val;
        btn.onclick = () => selectChoice(choice);
        container.appendChild(btn);
      });
    }

    function selectChoice(choice) {
      if (choice.used) return;
      const emptyIdx = userSlots.findIndex(s => s === null);
      if (emptyIdx !== -1) {
        userSlots[emptyIdx] = choice.val;
        choice.used = true;
        renderSlots();
        renderChoices();
        if (!userSlots.includes(null)) checkWin();
      }
    }

    function removeSlotItem(idx) {
      const val = userSlots[idx];
      if (val === null) return;
      userSlots[idx] = null;
      const choice = activeChoices.find(c => c.used && c.val === val);
      if (choice) choice.used = false;
      renderSlots();
      renderChoices();
    }

    function checkWin() {
      const userString = userSlots.join('');
      const targetString = targetUnits.join('');
      const banner = document.getElementById('feedbackBanner');

      if (userString === targetString) {
        stars += 10;
        document.getElementById('starsDisplay').innerText = stars;
        banner.className = 'feedback-banner success';
        banner.innerHTML = `✨ Muito bem! Você acertou! (+10 ⭐)`;
        banner.style.display = 'flex';
      } else {
        banner.className = 'feedback-banner error';
        banner.innerHTML = `⚠️ Tente novamente!`;
        banner.style.display = 'flex';
      }
    }

    function resetCurrentWord() { loadCurrentWord(); }

    function nextWord() {
      const filtered = WORDS_DATABASE.filter(w => w.level === currentLevel);
      currentIndex = (currentIndex + 1) % filtered.length;
      loadCurrentWord();
    }

    function prevWord() {
      const filtered = WORDS_DATABASE.filter(w => w.level === currentLevel);
      currentIndex = (currentIndex - 1 + filtered.length) % filtered.length;
      loadCurrentWord();
    }

    function speakCurrentWord() {
      if ('speechSynthesis' in window && currentWordItem) {
        const u = new SpeechSynthesisUtterance(currentWordItem.word);
        u.lang = 'pt-BR';
        window.speechSynthesis.speak(u);
      }
    }

    window.onload = () => { selectLevel(1); };
  </script>
</body>
</html>
